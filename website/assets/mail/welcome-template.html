<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light only">
<title>{{h1}}</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  body{margin:0;padding:0;background:#FDFCF9}
  a{color:#1F3FD1}
  @media (max-width:600px){
    .wrap{width:100%!important}
    .pad{padding-left:24px!important;padding-right:24px!important}
    .h1{font-size:40px!important}
  }
</style>
</head>
<body style="margin:0;padding:0;background:#FDFCF9;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;color:#FDFCF9;">{{pre}}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#FDFCF9;">
<tr><td align="center" style="padding:40px 12px 56px;">
<table role="presentation" class="wrap" width="560" cellpadding="0" cellspacing="0" border="0" style="width:560px;max-width:560px;">
<!-- logo -->
<tr><td align="center" style="padding:8px 0 44px;">
  <img src="https://feefee.co/assets/mail/logo.png" width="200" alt="fee fee. what's your fee?" style="display:block;width:200px;height:auto;border:0;">
</td></tr>
<!-- status -->
<tr><td class="pad" style="padding:0 40px;font-family:'Space Mono',Courier,monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#1C1E1A;">
  {{status}}
</td></tr>
<!-- headline -->
<tr><td class="pad h1" style="padding:14px 40px 0;font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:48px;line-height:1.02;color:#1C1E1A;">
  {{h1}}
</td></tr>
<!-- body -->
<tr><td class="pad" style="padding:26px 40px 0;font-family:'Cormorant Garamond',Georgia,serif;font-size:20px;line-height:1.5;color:#1C1E1A;">
  {{p1}}
  <br><br>
  {{p2}}
</td></tr>
<!-- letter -->
<tr><td align="center" style="padding:36px 40px 8px;">
  <img src="https://feefee.co/assets/mail/letter-01.jpg" width="380" alt="handwritten letter from Femke: dear creative, they want the photos for socials. socials is usage. usage is money. ask how long, where and who. then put a number on it. x femke" style="display:block;width:380px;max-width:100%;height:auto;border:0;">
</td></tr>
<!-- invite -->
<tr><td class="pad" style="padding:36px 40px 0;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#DEEAE0;">
  <tr><td style="padding:30px 28px 32px;">
    <div style="font-family:'Space Mono',Courier,monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#1C1E1A;">{{early}}</div>
    <div style="padding-top:12px;font-family:'Cormorant Garamond',Georgia,serif;font-size:20px;line-height:1.45;color:#1C1E1A;">{{bring}}</div>
    <div style="padding-top:18px;font-family:'Space Mono',Courier,monospace;font-size:13px;color:#1F3FD1;word-break:break-all;">feefee.co/?ref={{code}}</div>
    <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin-top:20px;"><tr>
      <td style="background:#1C1E1A;border-radius:999px;">
        <a href="https://feefee.co/?ref={{code}}" style="display:inline-block;padding:13px 26px;font-family:'Space Mono',Courier,monospace;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:#FDFCF9;text-decoration:none;">{{btn}}</a>
      </td>
    </tr></table>
  </td></tr>
  </table>
</td></tr>
<!-- share a fee -->
<tr><td class="pad" style="padding:30px 40px 0;font-family:'Cormorant Garamond',Georgia,serif;font-size:20px;line-height:1.5;color:#1C1E1A;">
  {{fee}}
  <br><a href="https://feefee.co/fee.html" style="font-family:'Space Mono',Courier,monospace;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:#1F3FD1;">{{feebtn}}</a>
</td></tr>
<!-- sign off -->
<tr><td class="pad" style="padding:40px 40px 0;font-family:'Cormorant Garamond',Georgia,serif;font-size:20px;line-height:1.5;color:#1C1E1A;">
  {{bye}}
  <div style="padding-top:6px;font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:32px;color:#1F3FD1;">x femke</div>
  <div style="font-family:'Space Mono',Courier,monospace;font-size:11px;letter-spacing:1px;color:#6B6E66;padding-top:4px;">{{role}}</div>
</td></tr>
<!-- footer -->
<tr><td class="pad" align="center" style="padding:64px 40px 0;font-family:'Space Mono',Courier,monospace;font-size:10px;line-height:1.9;letter-spacing:1.5px;text-transform:uppercase;color:#6B6E66;">
  {{f1}}<br>
  {{f2}}<br>
  <a href="https://instagram.com/feefee.co" style="color:#6B6E66;">@feefee.co</a> &middot; <a href="https://feefee.co" style="color:#6B6E66;">feefee.co</a><br>
  <span style="text-transform:none;letter-spacing:0.5px;">{{why}} <a href="mailto:hello@feefee.co?subject=unsubscribe" style="color:#6B6E66;">{{unsub}}</a></span>
</td></tr>
</table>
</td></tr>
</table>
</body>
</html>
