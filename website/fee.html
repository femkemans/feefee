<style>
:root{--paper:#FDFCF9;--celadon:#DEEAE0;--ink:#1C1E1A;--muted:#4A4E46;--soft:#8A8E86;--faint:#C9CDC5;--field:#EEF3EF;--blue:#1F3FD1;--ease:cubic-bezier(.2,.7,.2,1)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;color:var(--ink);font-family:'Cormorant Garamond',Georgia,serif;background:url(assets/grain.png) repeat,var(--paper);background-size:120px 120px,auto;-webkit-font-smoothing:antialiased}
a{color:var(--ink)}
[hidden]{display:none!important}
.mono{font-family:'Space Mono',monospace;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.cap{font-family:'Space Mono',monospace;font-size:11px;color:var(--muted);line-height:1.7}
.logo{font-family:'DM Sans',sans-serif;font-weight:800;font-style:italic;letter-spacing:-.034em;font-size:26px;text-decoration:none;text-transform:none}
.celadon{background:url(assets/grain.png) repeat,var(--celadon);background-size:120px 120px,auto}

header{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:22px 34px;pointer-events:none}
header>*{pointer-events:auto}
.lang button{background:none;border:0;font:inherit;cursor:pointer;color:var(--soft);padding:4px}
.lang button[aria-pressed=true]{color:var(--ink)}

.wrap{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;justify-content:center;padding:120px clamp(30px,5vw,88px) 64px;overflow:hidden}
.side .kick{margin:0 0 26px}
.side h1{font-style:italic;font-weight:400;font-size:clamp(64px,7.6vw,128px);line-height:.86;letter-spacing:-.02em;margin:0}
.side .lead{font-size:23px;line-height:1.45;margin:30px 0 0;max-width:420px}
.side .foot{position:absolute;left:clamp(30px,5vw,88px);bottom:34px;margin:0}
.sticky{position:absolute;right:clamp(20px,4vw,64px);bottom:64px;width:clamp(130px,10vw,170px);transform:rotate(5deg);filter:drop-shadow(0 18px 24px rgba(28,30,26,.12));transition:opacity .6s var(--ease)}

.main{display:flex;flex-direction:column;min-height:100vh;padding:120px clamp(24px,6vw,110px) 48px}
.trail{display:flex;flex-wrap:wrap;gap:6px 18px;margin:0 0 56px;padding:0;list-style:none}
.trail li{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);transition:color .4s}
.trail li.done{color:var(--soft)}
.trail li.now{color:var(--ink);font-weight:700}
.stage{flex:1;width:100%;max-width:640px}
.chapter{animation:in .7s var(--ease) both}
@keyframes in{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.q{margin:0 0 40px}
.q>.label{display:block;margin:0 0 14px}
.q>.label small{font-weight:400;color:var(--soft);letter-spacing:.1em}
.q .hint{margin:-6px 0 14px}
.qm{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;margin-left:10px;border:0;border-radius:50%;background:var(--field);font-family:'Space Mono',monospace;font-size:11px;font-weight:700;color:var(--muted);cursor:pointer;vertical-align:1px;letter-spacing:0;transition:background .2s,color .2s}
.qm:hover,.qm.on{background:var(--ink);color:var(--paper)}
.info{margin:-2px 0 18px;max-width:580px;padding:18px 22px;border-radius:10px;background:var(--field);color:var(--muted)}
.info p{margin:0 0 8px;font-size:18px;line-height:1.45;font-style:italic}
.info p:last-child{margin-bottom:0}
.info dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;margin:4px 0 10px}
.info dl:last-child{margin-bottom:0}
.info dt{font-family:'Space Mono',monospace;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--ink);padding-top:4px}
.info dd{margin:0;font-size:18px;line-height:1.4}
@media (max-width:600px){.info dl{grid-template-columns:1fr;gap:2px}.info dd{margin-bottom:8px}}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative;display:inline-flex}
.chip input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chip span{display:inline-flex;align-items:center;min-height:42px;padding:0 20px;border-radius:999px;background:var(--field);font-family:'Space Mono',monospace;font-size:13px;color:var(--ink);transition:background .25s,color .25s;user-select:none}
.chip:hover span{background:#E3ECE5}
.chip input:checked+span{background:var(--ink);color:var(--paper)}
.chip input:focus-visible+span{outline:2px solid var(--blue);outline-offset:2px}
.chip.on span::after{content:'×';margin-left:10px;opacity:.6}

.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{position:relative;display:block;cursor:pointer}
.tile input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.tile .in{display:flex;flex-direction:column;gap:8px;height:100%;padding:24px 24px 22px;border-radius:10px;background:var(--paper);box-shadow:0 1px 0 rgba(28,30,26,.04),0 18px 40px rgba(28,30,26,.07);transition:background .3s,color .3s,transform .3s var(--ease)}
.tile:hover .in{transform:translateY(-2px)}
.tile .t{font-style:italic;font-size:30px;line-height:1}
.tile .s{font-family:'Space Mono',monospace;font-size:11px;line-height:1.6;color:var(--muted)}
.tile input:checked+.in{background:var(--ink);color:var(--paper)}
.tile input:checked+.in .s{color:#C9CDC5}
.tile input:focus-visible+.in{outline:2px solid var(--blue);outline-offset:3px}

.field{height:50px;padding:0 22px;border:0;border-radius:999px;background:var(--field);font-family:'Space Mono',monospace;font-size:14px;color:var(--ink);width:100%}
.field::placeholder{color:#868A82}
.field:focus{outline:2px solid var(--blue);outline-offset:2px}
.row{display:flex;gap:8px}
.ghost{height:50px;padding:0 24px;border:0;border-radius:999px;background:var(--celadon);font-family:'Space Mono',monospace;font-size:13px;color:var(--ink);cursor:pointer;white-space:nowrap}

.number{background:var(--paper);border-radius:12px;box-shadow:0 30px 70px rgba(28,30,26,.09);padding:38px 36px 32px}
.amount{display:flex;align-items:baseline;gap:12px}
.amount .sym{font-style:italic;font-size:clamp(48px,6vw,88px);line-height:1;color:var(--soft)}
.amount input{flex:1;min-width:0;border:0;background:transparent;font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:clamp(72px,9vw,128px);line-height:1;color:var(--ink);padding:0;-moz-appearance:textfield}
.amount input::placeholder{color:#D6D9D2}
.amount input:focus{outline:none}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.cur{margin-top:24px}
.cur .chip span{min-height:34px;padding:0 14px;font-size:12px}
.steps{display:flex;flex-wrap:wrap;gap:22px 40px;margin-top:28px}
.step{display:flex;align-items:center;gap:8px}
.step button{width:38px;height:38px;border-radius:50%;border:0;background:var(--field);font-family:'Space Mono',monospace;font-size:16px;cursor:pointer;color:var(--ink)}
.step input{width:54px;height:38px;border:0;background:transparent;text-align:center;font-family:'Space Mono',monospace;font-size:16px;font-weight:700;color:var(--ink);-moz-appearance:textfield}
.steps{flex-direction:column;gap:14px}
.steprow{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.step .lab{display:inline-block;min-width:150px}
.rates .chip span{min-height:32px;padding:0 12px;font-size:11px}
.rate{margin:26px 0 0;font-style:italic;font-size:26px;color:var(--blue);min-height:1.3em}

.nav{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;max-width:640px;margin-top:24px;padding-top:12px}
.back{background:none;border:0;padding:8px 0;font-family:'Space Mono',monospace;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.back:hover{color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;height:58px;padding:0 40px;border:0;border-radius:999px;background:var(--ink);color:var(--paper);font-family:'Space Mono',monospace;font-size:14px;cursor:pointer;text-decoration:none;transition:opacity .2s}
.btn:hover{opacity:.88}
.btn:disabled{opacity:.4;cursor:default}
.btn.soft{background:var(--celadon);color:var(--ink)}
.err{min-height:1.5em;margin:16px 0 0;color:#9B2C1F;max-width:640px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}

.ask{margin-top:44px;background:var(--paper);border-radius:12px;box-shadow:0 30px 70px rgba(28,30,26,.09);padding:34px 34px 30px;max-width:600px}
.ask ol{margin:0;padding-left:24px;font-size:22px;line-height:1.55}

@media (prefers-reduced-motion: reduce){.chapter{animation:none}.tile .in{transition:none}}
@media (max-width:900px){
  .wrap{grid-template-columns:1fr}
  .side{position:relative;height:auto;padding:92px 20px 40px}
  .side h1{font-size:clamp(54px,15vw,80px)}
  .side .lead{font-size:20px;margin-top:18px}
  .side .foot,.sticky{display:none}
  .main{min-height:0;padding:36px 20px 40px}
  .trail{margin-bottom:36px}
  header{position:absolute;padding:18px 20px}
  .tiles{grid-template-columns:1fr}
  .number{padding:28px 22px 24px}
  .nav{position:sticky;bottom:0;background:linear-gradient(rgba(253,252,249,0),var(--paper) 30%);padding:28px 0 16px}
}
.fair{margin:36px 0 0;max-width:560px;color:var(--muted);line-height:1.7;text-transform:none;letter-spacing:.02em}
</style>
</head>

  job_type:{en:'editorial: for a magazine or publication, usually lower fees but good for your portfolio. commercial: content for a brand to sell something. campaign: the main images of a brand’s season or launch, often seen everywhere, so usually the highest fees. e-commerce: product or model images for a webshop, often many images per day.',nl:'redactioneel: voor een magazine of publicatie, meestal lagere fees maar goed voor je portfolio. commercieel: content voor een merk om iets te verkopen. campagne: de hoofdbeelden van een seizoen of lancering, vaak overal te zien, dus meestal de hoogste fees. e-commerce: product- of modelbeelden voor een webshop, vaak veel beelden per dag.'},

  usage_period:{en:'how long the client may use your work. after that period they should pay again to keep using it. longer = more money.',nl:'hoe lang de klant je werk mag gebruiken. daarna horen ze opnieuw te betalen om het te blijven gebruiken. langer = meer geld.'},

  prep_rate:{en:'prep days are days you work before the shoot: moodboards, shopping, tests, meetings. many creatives charge them at 50–100% of their day rate. never for free.',nl:'voorbereidingsdagen zijn dagen dat je vóór de shoot werkt: moodboards, shoppen, tests, meetings. veel creatives rekenen 50–100% van hun dagtarief. nooit gratis.'},
  travel_rate:{en:'travel days are days you only travel to or from the job. the standard is 50% of your day rate.',nl:'reisdagen zijn dagen dat je alleen naar of van de klus reist. de standaard is 50% van je dagtarief.'},
  equipment:{en:'kit is your gear: camera, lights, steamers, brushes. you can include it in your fee, bill it separately (a kit fee), or rent it and pass the cost on to the client.',nl:'kit is je apparatuur: camera, lampen, stomers, kwasten. je kunt het in je fee meenemen, apart factureren (een kit fee) of huren en de kosten doorberekenen aan de klant.'},
  assistant:{en:'does someone assist you on set, and who pays them? if it comes out of your own fee, your real day rate is lower than it looks.',nl:'assisteert iemand je op set, en wie betaalt diegene? komt het uit je eigen fee, dan is je echte dagtarief lager dan het lijkt.'},
  deliverables:{en:'how many final, edited images the client receives. more images = more editing time.',nl:'hoeveel definitieve, bewerkte beelden de klant krijgt. meer beelden = meer bewerkingstijd.'},
  retouch:{en:'basic: colour correction and small clean-ups. high-end / beauty: detailed skin, hair and product work. compositing: combining several images into one.',nl:'basis: kleurcorrectie en kleine opschoning. high-end / beauty: gedetailleerd werk aan huid, haar en product. compositing: meerdere beelden samenvoegen tot één.'},
  retouch_level:{en:'basic: colour correction and small clean-ups. high-end / beauty: detailed skin, hair and product work. compositing: combining several images into one.',nl:'basis: kleurcorrectie en kleine opschoning. high-end / beauty: gedetailleerd werk aan huid, haar en product. compositing: meerdere beelden samenvoegen tot één.'},

function rate(){
  var r=$('rate'), rb=$('rate-b'); if(!r) return; var t=T[lang], amt=Number(A.fee_amount), d=Number(A.days)||0;
  var pd=Number(A.prep_days)||0, td=Number(A.travel_days)||0, pp=Number(A.prep_rate)/100, tp=Number(A.travel_rate)/100;
  var units=d+pd*pp+td*tp;
  if(amt>0 && d>0 && (units!==1 || pd||td)){
    var s=SYM[A.currency]||'', fmt=function(n){ return s+(s.length>1?' ':'')+Math.round(n).toLocaleString(lang==='nl'?'nl-NL':'en-GB'); };
    var day=amt/units; r.textContent=t.perDay.replace('{x}', fmt(day));
    var parts=[d+' '+t.days+' × '+fmt(day)];
    if(pd) parts.push(pd+' '+t.prepOnly+' × '+(pp?fmt(day*pp)+' ('+A.prep_rate+'%)':t.unpaid));
    if(td) parts.push(td+' '+t.travel+' × '+(tp?fmt(day*tp)+' ('+A.travel_rate+'%)':t.unpaid));
    rb.textContent = parts.join('  ·  ');
  } else { r.textContent=''; rb.textContent=''; }
}
function valid(){
  var c=CH[at];
  if(c==='start') return A.stage && A.discipline && (A.roles.length||A.own.length);
  if(c==='job') return A.job_type && A.client_type && A.country.trim().length>=2;
  if(c==='number'){ var f=Number(A.fee_amount), d=Number(A.days); return f>0 && f<1000000 && d>0 && d<=60; }
  if(c==='rights') return A.usage.length>0;
  return true;
}

}

/* ---------- calendar option (.ics + Google), built in the browser, nothing stored ---------- */
function ymd(d){ return d.toISOString().slice(0,10).replace(/-/g,''); }
function calInfo(){
  var t=T[lang], d=DISC.filter(function(x){return x[0]===A.discipline})[0];
  var start = A.date ? new Date(A.date+'T00:00:00Z') : null;
  var prep = Math.ceil(Number(A.prep_days)||0), travel = Math.ceil(Number(A.travel_days)||0), shoot = Math.max(1,Math.ceil(Number(A.days)||1));
  var title = (A.stage==='booked' ? t.calBooked : t.calOption)+' · '+(A.job_type||'')+' · '+(A.client_type||'');
  var s=SYM[A.currency]||''; var fee = A.fee_amount ? s+(s.length>1?' ':'')+Number(A.fee_amount).toLocaleString(lang==='nl'?'nl-NL':'en-GB') : '';
  var desc = [A.roles.concat(A.own).join(', '), fee ? t.calFee+': '+fee+' ('+Number(A.days)+' '+t.days+(Number(A.prep_days)?(', '+Number(A.prep_days)+' '+t.prepOnly+' @ '+A.prep_rate+'%'):'')+(Number(A.travel_days)?(', '+Number(A.travel_days)+' '+t.travel+' @ '+A.travel_rate+'%'):'')+')' : '', A.country, '', t.calFrom].filter(function(x){return x!==null}).join('\n');
  return {start:start, prep:prep, travel:travel, shoot:shoot, title:title, desc:desc};
}
function icsFile(){
  var i=calInfo(), now=new Date(), lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//fee fee.//say the number//EN','CALSCALE:GREGORIAN'];
  function esc(x){ return String(x).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n'); }
  function ev(uid, s, days, title){ var e=new Date(s.getTime()+days*864e5);
    lines.push('BEGIN:VEVENT','UID:'+uid+'@feefee.co','DTSTAMP:'+now.toISOString().replace(/[-:]/g,'').slice(0,15)+'Z','DTSTART;VALUE=DATE:'+ymd(s),'DTEND;VALUE=DATE:'+ymd(e),'SUMMARY:'+esc(title),'DESCRIPTION:'+esc(i.desc),'TRANSP:'+(A.stage==='booked'?'OPAQUE':'TRANSPARENT'),'END:VEVENT'); }
  var id=Date.now().toString(36);
  if(i.prep){ ev(id+'p', new Date(i.start.getTime()-(i.prep+i.travel)*864e5), i.prep, T[lang].calPrep+' · '+i.title); }
  if(i.travel){ ev(id+'t', new Date(i.start.getTime()-i.travel*864e5), i.travel, T[lang].calTravel+' · '+i.title); }
  ev(id, i.start, i.shoot, i.title);
  lines.push('END:VCALENDAR'); return lines.join('\r\n');
}

}
