<style>
:root{--paper:#FDFCF9;--celadon:#DEEAE0;--ink:#1C1E1A;--muted:#4A4E46;--soft:#8A8E86;--faint:#C9CDC5;--field:#EEF3EF;--blue:#1F3FD1;--ease:cubic-bezier(.2,.7,.2,1)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;color:var(--ink);font-family:'Cormorant Garamond',Georgia,serif;background:url(assets/grain.png) repeat,var(--paper);background-size:120px 120px,auto;-webkit-font-smoothing:antialiased}
a{color:var(--ink)}
[hidden]{display:none!important}
.mono{font-family:'Space Mono',monospace;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.cap{font-family:'Space Mono',monospace;font-size:11px;color:var(--muted);line-height:1.7}
.logo{font-family:'Tenor Sans',sans-serif;letter-spacing:-.065em;font-size:26px;text-decoration:none;text-transform:none;font-weight:400}
.celadon{background:url(assets/grain.png) repeat,var(--celadon);background-size:120px 120px,auto}

header{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:22px 34px;pointer-events:none}
header>*{pointer-events:auto}
.lang button{background:none;border:0;font:inherit;cursor:pointer;color:var(--soft);padding:4px}
.lang button[aria-pressed=true]{color:var(--ink)}

.wrap{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;justify-content:center;padding:120px clamp(30px,5vw,88px) 64px;overflow:hidden}
.side .kick{margin:0 0 26px}
.side h1{font-style:italic;font-weight:400;font-size:clamp(64px,7.6vw,128px);line-height:.86;letter-spacing:-.02em;margin:0}
.side .lead{font-size:23px;line-height:1.45;margin:30px 0 0;max-width:420px}
.side .foot{position:absolute;left:clamp(30px,5vw,88px);bottom:34px;margin:0}
.sticky{position:absolute;right:clamp(20px,4vw,64px);bottom:64px;width:clamp(130px,10vw,170px);transform:rotate(5deg);filter:drop-shadow(0 18px 24px rgba(28,30,26,.12));transition:opacity .6s var(--ease)}

.main{display:flex;flex-direction:column;min-height:100vh;padding:120px clamp(24px,6vw,110px) 48px}
.trail{display:flex;flex-wrap:wrap;gap:6px 18px;margin:0 0 56px;padding:0;list-style:none}
.trail li{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);transition:color .4s}
.trail li.done{color:var(--soft)}
.trail li.now{color:var(--ink);font-weight:700}
.stage{flex:1;width:100%;max-width:640px}
.chapter{animation:in .7s var(--ease) both}
@keyframes in{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.q{margin:0 0 40px}
.q>.label{display:block;margin:0 0 14px}
.q>.label small{font-weight:400;color:var(--soft);letter-spacing:.1em}
.q .hint{margin:-6px 0 14px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative;display:inline-flex}
.chip input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chip span{display:inline-flex;align-items:center;min-height:42px;padding:0 20px;border-radius:999px;background:var(--field);font-family:'Space Mono',monospace;font-size:13px;color:var(--ink);transition:background .25s,color .25s;user-select:none}
.chip:hover span{background:#E3ECE5}
.chip input:checked+span{background:var(--ink);color:var(--paper)}
.chip input:focus-visible+span{outline:2px solid var(--blue);outline-offset:2px}
.chip.on span::after{content:'×';margin-left:10px;opacity:.6}

.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{position:relative;display:block;cursor:pointer}
.tile input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.tile .in{display:flex;flex-direction:column;gap:8px;height:100%;padding:24px 24px 22px;border-radius:10px;background:var(--paper);box-shadow:0 1px 0 rgba(28,30,26,.04),0 18px 40px rgba(28,30,26,.07);transition:background .3s,color .3s,transform .3s var(--ease)}
.tile:hover .in{transform:translateY(-2px)}
.tile .t{font-style:italic;font-size:30px;line-height:1}
.tile .s{font-family:'Space Mono',monospace;font-size:11px;line-height:1.6;color:var(--muted)}
.tile input:checked+.in{background:var(--ink);color:var(--paper)}
.tile input:checked+.in .s{color:#C9CDC5}
.tile input:focus-visible+.in{outline:2px solid var(--blue);outline-offset:3px}

.field{height:50px;padding:0 22px;border:0;border-radius:999px;background:var(--field);font-family:'Space Mono',monospace;font-size:14px;color:var(--ink);width:100%}
.field::placeholder{color:#868A82}
.field:focus{outline:2px solid var(--blue);outline-offset:2px}
.row{display:flex;gap:8px}
.ghost{height:50px;padding:0 24px;border:0;border-radius:999px;background:var(--celadon);font-family:'Space Mono',monospace;font-size:13px;color:var(--ink);cursor:pointer;white-space:nowrap}

.number{background:var(--paper);border-radius:12px;box-shadow:0 30px 70px rgba(28,30,26,.09);padding:38px 36px 32px}
.amount{display:flex;align-items:baseline;gap:12px}
.amount .sym{font-style:italic;font-size:clamp(48px,6vw,88px);line-height:1;color:var(--soft)}
.amount input{flex:1;min-width:0;border:0;background:transparent;font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:clamp(72px,9vw,128px);line-height:1;color:var(--ink);padding:0;-moz-appearance:textfield}
.amount input::placeholder{color:#D6D9D2}
.amount input:focus{outline:none}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.cur{margin-top:24px}
.cur .chip span{min-height:34px;padding:0 14px;font-size:12px}
.steps{display:flex;flex-wrap:wrap;gap:22px 40px;margin-top:28px}
.step{display:flex;align-items:center;gap:8px}
.step button{width:38px;height:38px;border-radius:50%;border:0;background:var(--field);font-family:'Space Mono',monospace;font-size:16px;cursor:pointer;color:var(--ink)}
.step input{width:54px;height:38px;border:0;background:transparent;text-align:center;font-family:'Space Mono',monospace;font-size:16px;font-weight:700;color:var(--ink);-moz-appearance:textfield}
.rate{margin:26px 0 0;font-style:italic;font-size:26px;color:var(--blue);min-height:1.3em}

.nav{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;max-width:640px;margin-top:24px;padding-top:12px}
.back{background:none;border:0;padding:8px 0;font-family:'Space Mono',monospace;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.back:hover{color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;height:58px;padding:0 40px;border:0;border-radius:999px;background:var(--ink);color:var(--paper);font-family:'Space Mono',monospace;font-size:14px;cursor:pointer;text-decoration:none;transition:opacity .2s}
.btn:hover{opacity:.88}
.btn:disabled{opacity:.4;cursor:default}
.btn.soft{background:var(--celadon);color:var(--ink)}
.err{min-height:1.5em;margin:16px 0 0;color:#9B2C1F;max-width:640px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}

.ask{margin-top:44px;background:var(--paper);border-radius:12px;box-shadow:0 30px 70px rgba(28,30,26,.09);padding:34px 34px 30px;max-width:600px}
.ask ol{margin:0;padding-left:24px;font-size:22px;line-height:1.55}

@media (prefers-reduced-motion: reduce){.chapter{animation:none}.tile .in{transition:none}}
@media (max-width:900px){
  .wrap{grid-template-columns:1fr}
  .side{position:relative;height:auto;padding:92px 20px 40px}

  .side .foot,.sticky{display:none}
  .main{min-height:0;padding:36px 20px 40px}
  .trail{margin-bottom:36px}
  header{position:absolute;padding:18px 20px}
  .tiles{grid-template-columns:1fr}
  .number{padding:28px 22px 24px}
  .nav{position:sticky;bottom:0;background:linear-gradient(rgba(253,252,249,0),var(--paper) 30%);padding:28px 0 16px}
}
</style>

/* ---------- state ---------- */

function $(id){return document.getElementById(id)}

function el(tag, cls, txt){var e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e}

/* chips: single or multi; get/set via callbacks */
function chips(name, opts, multi, get, set){
  var box=el('div','chips');
  opts.forEach(function(o){
    var lab=el('label','chip'), inp=document.createElement('input');
    inp.type=multi?'checkbox':'radio'; inp.name=name; inp.value=o[0];
    var cur=get(); inp.checked = multi ? cur.indexOf(o[0])>-1 : cur===o[0];
    inp.addEventListener('click',function(){
      var v=get();
      if(multi){
        var ex=EXCLUSIVE.indexOf(o[0])>-1;
        if(inp.checked){ v = ex ? [o[0]] : v.filter(function(x){return EXCLUSIVE.indexOf(x)<0}).concat([o[0]]); }
        else v = v.filter(function(x){return x!==o[0]});
        set(v); box.querySelectorAll('input').forEach(function(i){ i.checked = v.indexOf(i.value)>-1 });
      } else {
        if(v===o[0]){ inp.checked=false; set(''); } else set(o[0]);
      }
      onChange();
    });
    lab.appendChild(inp); lab.appendChild(el('span',null,L(o))); box.appendChild(lab);
  });
  return box;
}
function q(labelTxt, optional, node, hint){
  var d=el('div','q'), l=el('span','mono label',labelTxt);
  if(optional){ l.appendChild(document.createTextNode(' ')); l.appendChild(el('small',null,optional)); }
  d.appendChild(l); if(hint) d.appendChild(el('p','cap hint',hint)); d.appendChild(node); return d;
}
function onChange(){ $('err').textContent=''; if(CH[at]==='number') rate(); }

/* ---------- chapter renderers ---------- */
var R = {
  start:function(c){
    c.appendChild(q(T[lang].stage,null,chips('stage',O.stage,false,function(){return A.stage},function(v){A.stage=v})));
    var tiles=el('div','tiles');
    DISC.forEach(function(d){
      var lab=el('label','tile'), inp=document.createElement('input'); inp.type='radio'; inp.name='discipline'; inp.value=d[0]; inp.checked=A.discipline===d[0];
      var inn=el('span','in'); inn.appendChild(el('span','t',d[1][lang])); inn.appendChild(el('span','s',d[2].slice(0,3).join(' · ')));
      inp.addEventListener('change',function(){ if(A.discipline!==d[0]){ A.discipline=d[0]; A.roles=[]; A.craft={}; } render(); });
      lab.appendChild(inp); lab.appendChild(inn); tiles.appendChild(lab);
    });
    c.appendChild(q(T[lang].disc,null,tiles));
    if(A.discipline){
      var d=DISC.filter(function(x){return x[0]===A.discipline})[0];
      var wrap=el('div');
      var rc=chips('roles',d[2].map(function(r){return [r]}),true,function(){return A.roles},function(v){A.roles=v});
      wrap.appendChild(rc);
      var picked=el('div','chips'); picked.style.marginTop='10px';
      A.own.forEach(function(v){ var b=el('button','chip on'); b.type='button'; b.style.cssText='border:0;background:none;padding:0;cursor:pointer'; b.appendChild(el('span',null,v)); b.setAttribute('aria-label','remove '+v);
        b.addEventListener('click',function(){ A.own=A.own.filter(function(x){return x!==v}); render(); }); picked.appendChild(b); });
      wrap.appendChild(picked);
      var row=el('div','row'); row.style.marginTop='10px';
      var own=el('input','field'); own.type='text'; own.maxLength=40; own.placeholder=T[lang].own; own.setAttribute('aria-label',T[lang].own);
      var add=el('button','ghost',T[lang].add); add.type='button';
      function addOwn(){ var v=own.value.replace(/[,<>]/g,' ').trim().slice(0,40); if(v.length<2) return; if(A.own.indexOf(v)<0 && A.roles.indexOf(v)<0) A.own.push(v); render(); }
      add.addEventListener('click',addOwn); own.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); addOwn(); } });
      row.appendChild(own); row.appendChild(add); wrap.appendChild(row);
      c.appendChild(q(T[lang].roles,T[lang].multi,wrap));
    }
  },
  job:function(c){
    c.appendChild(q(T[lang].job_type,null,chips('job_type',O.job_type,false,function(){return A.job_type},function(v){A.job_type=v})));
    c.appendChild(q(T[lang].client_type,null,chips('client_type',O.client_type,false,function(){return A.client_type},function(v){A.client_type=v})));
    var inp=el('input','field'); inp.type='text'; inp.maxLength=60; inp.placeholder=T[lang].countryPh; inp.value=A.country; inp.setAttribute('list','countries'); inp.autocomplete='off'; inp.id='country';
    inp.addEventListener('input',function(){ A.country=inp.value; onChange(); });
    var dl=el('datalist'); dl.id='countries'; COUNTRIES.forEach(function(x){ var o=el('option'); o.value=x; dl.appendChild(o); });
    var w=el('div'); w.appendChild(inp); w.appendChild(dl);

  },
  number:function(c){
    var box=el('div','number'), am=el('div','amount'), sym=el('span','sym',SYM[A.currency]||''); sym.id='sym'; sym.setAttribute('aria-hidden','true');
    var inp=el('input'); inp.type='number'; inp.inputMode='numeric'; inp.min='1'; inp.max='999999'; inp.placeholder='0'; inp.value=A.fee_amount; inp.id='fee_amount'; inp.setAttribute('aria-label','fee');
    inp.addEventListener('input',function(){ A.fee_amount=inp.value; onChange(); });
    am.appendChild(sym); am.appendChild(inp); box.appendChild(am);

    var steps=el('div','steps');
    [['days',T[lang].days,.5,60],['prep_days',T[lang].prep,0,30]].forEach(function(s){
      var st=el('div','step'); st.appendChild(el('span','mono',s[1]));
      var mi=el('button',null,'−'), v=el('input'), pl=el('button',null,'+'); mi.type=pl.type='button';
      v.type='number'; v.step='0.5'; v.min=s[2]; v.max=s[3]; v.value=A[s[0]]; v.id=s[0]; v.setAttribute('aria-label',s[1]);
      function setv(n){ n=Math.max(s[2],Math.min(s[3],n)); A[s[0]]=n; v.value=n; onChange(); }
      mi.addEventListener('click',function(){setv((Number(v.value)||0)-.5)}); pl.addEventListener('click',function(){setv((Number(v.value)||0)+.5)});
      v.addEventListener('input',function(){ A[s[0]]=Number(v.value)||0; onChange(); });
      st.appendChild(mi); st.appendChild(v); st.appendChild(pl); steps.appendChild(st);

    box.appendChild(steps);
    var r=el('p','rate'); r.id='rate'; r.setAttribute('aria-live','polite'); box.appendChild(r);
    c.appendChild(box); rate();
  },
  craft:function(c){
    var qs=CRAFT[A.discipline]||[];
    if(!qs.length){ c.appendChild(el('p','cap',T[lang].noCraft)); return; }

      var get=function(){ return A.craft[x.id]!=null ? A.craft[x.id] : (x.type==='many'?[]:'') };

  rights:function(c){

    c.appendChild(q(T[lang].experience,T[lang].optional,chips('experience',O.experience,false,function(){return A.experience},function(v){A.experience=v})));

};
function rate(){
  var r=$('rate'); if(!r) return; var amt=Number(A.fee_amount), d=Number(A.days);
  if(amt>0 && d>0 && d!==1){ var s=SYM[A.currency]||''; r.textContent=T[lang].perDay.replace('{x}', s+(s.length>1?' ':'')+Math.round(amt/d).toLocaleString(lang==='nl'?'nl-NL':'en-GB')); }
  else r.textContent='';
}
function valid(){
  var c=CH[at];
  if(c==='start') return A.stage && A.discipline && (A.roles.length||A.own.length);
  if(c==='job') return A.job_type && A.client_type && A.country.trim().length>=2;
  if(c==='number'){ var f=Number(A.fee_amount), d=Number(A.days); return f>0 && f<1000000 && d>0 && d<=60; }
  if(c==='rights') return A.usage.length>0;
  return true;
}

/* ---------- render ---------- */
function side(key){
  var s=SIDE[key][lang], d=DISC.filter(function(x){return x[0]===A.discipline})[0]; $('s-kick').textContent=s[0].replace('{disc}', d ? (lang==='nl'?'voor ':'for ')+d[1][lang] : ''); $('s-title').textContent=s[1]; $('s-lead').textContent=s[2];
  $('s-foot').textContent=T[lang].foot; $('s-note').style.opacity = key==='start' ? 1 : 0;
}
var lastAt=-1;
function render(){
  var t=T[lang], c=$('chapter'); c.innerHTML=''; if(lastAt!==at){ c.className=''; void c.offsetWidth; c.className='chapter'; lastAt=at; }
  var tr=$('trail'); tr.innerHTML='';
  CH.forEach(function(k,i){ var li=el('li',i<at?'done':(i===at?'now':''),CHN[k][lang]); if(i===at) li.setAttribute('aria-current','step'); tr.appendChild(li); });
  if(sent){ thanks(); return; }
  side(CH[at]); R[CH[at]](c);
  $('back').textContent='← '+t.back; $('back').style.visibility = at===0 ? 'hidden' : 'visible';
  $('next').textContent = at===CH.length-1 ? t.submit+' →' : t.next+' →';
  $('nav').hidden=false;
}
function thanks(){
  side('thanks'); $('trail').innerHTML=''; $('nav').hidden=true;
  var c=$('chapter'), t=T[lang];
  if(A.stage==='quoting'){
    var list=ASK.base[lang].slice(0,1).concat((ASK[A.discipline]||ASK.other)[lang]).concat(ASK.base[lang].slice(1));
    var box=el('div','ask'); box.appendChild(el('p','mono',t.askTitle)); box.firstChild.style.margin='0 0 16px';
    var ol=el('ol'); list.forEach(function(x){ ol.appendChild(el('li',null,x)); }); box.appendChild(ol);
    var tip=el('p','cap',t.askTip); tip.style.margin='18px 0 0'; box.appendChild(tip);
    var cp=el('button','btn soft',t.copy); cp.type='button'; cp.style.cssText='height:44px;padding:0 22px;font-size:12px;margin-top:18px';
    cp.addEventListener('click',function(){ var txt=list.map(function(x,i){return (i+1)+'. '+x}).join('\n');
      if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(function(){ cp.textContent=t.copied; setTimeout(function(){cp.textContent=t.copy},2000); },function(){}); });
    box.appendChild(cp); c.appendChild(box);
  }
  var row=el('div'); row.style.cssText='display:flex;flex-wrap:wrap;gap:12px;margin-top:40px';
  var again=el('a','btn',t.again); again.href='#'; again.addEventListener('click',function(e){ e.preventDefault(); location.reload(); });
  var join=el('a','btn soft',t.join); join.href='index.html#join';
  row.appendChild(again); row.appendChild(join); c.appendChild(row);
  window.scrollTo({top:0,behavior:'smooth'});
}
function go(n){ at=Math.max(0,Math.min(CH.length-1,n)); render(); window.scrollTo({top:0,behavior:'smooth'}); }
$('next').addEventListener('click',function(){
  if(!valid()){ $('err').textContent=T[lang].err; return; }
  $('err').textContent='';
  if(at<CH.length-1) go(at+1); else submit();
});
$('back').addEventListener('click',function(){ $('err').textContent=''; go(at-1); });
$('fee').addEventListener('submit',function(e){ e.preventDefault(); $('next').click(); });
document.querySelectorAll('[data-lang]').forEach(function(b){ b.addEventListener('click',function(){
  lang=b.getAttribute('data-lang'); document.documentElement.lang=lang;
  document.querySelectorAll('[data-lang]').forEach(function(x){ x.setAttribute('aria-pressed', x.getAttribute('data-lang')===lang?'true':'false') });
  try{localStorage.setItem('ff-lang',lang)}catch(e){} render(); }); });

/* ---------- submit ---------- */
function clean(o){ var r={}; Object.keys(o).forEach(function(k){ var v=o[k]; if(v!=='' && v!=null && !(Array.isArray(v)&&!v.length)) r[k]=v; }); return r; }
function submit(){
  if(document.querySelector('[name=website]').value){ sent=true; render(); return; }
  var craft=clean(A.craft), equipment=craft.equipment||null, deliverables=craft.deliverables||null;
  delete craft.equipment; delete craft.deliverables;
  var row={
    stage:A.stage, discipline:A.discipline, role:A.roles.concat(A.own).join(', ').slice(0,200),
    job_type:A.job_type, client_type:A.client_type, country:A.country.trim().slice(0,60),
    fee_amount:Number(A.fee_amount), currency:A.currency, days:Number(A.days), prep_days:Number(A.prep_days)||null,
    usage:A.usage, usage_period:A.usage_period||null, territory:A.territory||null,
    equipment:equipment, deliverables:deliverables, craft:Object.keys(craft).length?craft:null,
    included:A.included.length?A.included:null, billed_extra:A.billed_extra.length?A.billed_extra:null,
    payment:(A.stage==='done'?A.payment:'')||null, experience:A.experience||null
  };
  var btn=$('next'); btn.disabled=true;
  fetch(SUPABASE_URL+'/rest/v1/fee_entries',{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(row)})
    .then(function(r){ if(!r.ok) throw new Error(r.status); sent=true; render(); })
    .catch(function(){ $('err').textContent=T[lang].errSend; })
    .then(function(){ btn.disabled=false; });
}

/* ---------- init ---------- */
(function(){ var s=null; try{s=localStorage.getItem('ff-lang')}catch(e){} if(s==='nl'){ lang='nl'; document.documentElement.lang='nl';
  document.querySelectorAll('[data-lang]').forEach(function(x){ x.setAttribute('aria-pressed', x.getAttribute('data-lang')==='nl'?'true':'false') }); } render(); })();
</script>
